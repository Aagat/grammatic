[package]
name = "grammatic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "migrate", "chrono", "macros", "json"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4"] }

axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde_json = "1.0.151"

[dev-dependencies]
